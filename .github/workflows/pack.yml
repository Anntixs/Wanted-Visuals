name: pack

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build mod
        run: gradle build --no-daemon

      - name: Assemble launcher packs
        run: packaging/build-pack.sh 1.0.0

      - name: Upload packs
        uses: actions/upload-artifact@v4
        with:
          name: WantedVisuals-client
          path: dist/*
