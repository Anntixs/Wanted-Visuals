name: runclient

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  runclient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install headless OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa mesa-utils libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Launch client headless
        # Клиент не должен сам завершаться, поэтому просто ждём и смотрим, упал ли он.
        run: |
          set +e
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            timeout 240 gradle runClient --no-daemon > run-output.log 2>&1
          echo "exit=$?"
          set -e

      - name: Show client log
        if: always()
        run: |
          echo "===== gradle/run output (tail) ====="
          tail -n 200 run-output.log || true
          echo "===== latest.log (tail) ====="
          tail -n 200 run/logs/latest.log 2>/dev/null || echo "no latest.log"
          echo "===== crash reports ====="
          for f in run/crash-reports/*; do
            echo "--- $f"
            head -n 120 "$f"
          done 2>/dev/null || echo "no crash reports"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: |
            run-output.log
            run/logs/**
            run/crash-reports/**
          if-no-files-found: warn
