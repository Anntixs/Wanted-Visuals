name: runclient

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  runclient:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Install headless OpenGL stack
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libglu1-mesa mesa-utils libxi6 libxcursor1 libxrandr2 libxinerama1

      - name: Launch client and wait for the main menu
        run: |
          set -uo pipefail
          rm -rf run/logs
          # Клиент запускаем в фоне: ждём в логе признак, что игра дошла до меню.
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            gradle runClient --no-daemon > run-output.log 2>&1 &
          gradle_pid=$!

          ok=0
          for i in $(seq 1 90); do
            if grep -qE "Sound engine started|Created: .*minecraft:textures/atlas" run/logs/latest.log 2>/dev/null; then
              ok=1
              echo "клиент дошёл до главного меню"
              break
            fi
            if ! kill -0 "$gradle_pid" 2>/dev/null; then
              echo "процесс клиента завершился раньше времени"
              break
            fi
            sleep 5
          done

          # Гасим клиент в любом случае, чтобы шаг не висел.
          kill -9 "$gradle_pid" 2>/dev/null || true
          pkill -9 -f "net.fabricmc.devlaunchinjector" 2>/dev/null || true
          pkill -9 -f "GradleWrapperMain|GradleDaemon" 2>/dev/null || true
          sleep 2

          echo "MENU_REACHED=$ok" >> "$GITHUB_ENV"

      - name: Show client log
        if: always()
        run: |
          echo "===== gradle/run output (tail) ====="
          tail -n 120 run-output.log || true
          echo "===== latest.log (tail) ====="
          tail -n 120 run/logs/latest.log 2>/dev/null || echo "no latest.log"
          echo "===== crash reports ====="
          for f in run/crash-reports/*; do
            echo "--- $f"
            head -n 120 "$f"
          done 2>/dev/null || echo "no crash reports"

      - name: Fail if the client never reached the menu
        if: always()
        run: test "$MENU_REACHED" = "1"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logs
          path: |
            run-output.log
            run/logs/**
            run/crash-reports/**
          if-no-files-found: warn
